name: Refresh live NASA FIRMS data
# Every six hours: download NASA FIRMS' public seven-day files (no API key), rebuild the three provisional
# live files and commit them. A host that deploys on push (Vercel) then serves the fresh data with no server.
# The historical archive is never touched.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely
      - name: Preset snapshot (all four feeds)
        run: node scripts/fetch_live.mjs
      - name: Punjab districts this week
        run: python scripts/fetch_punjab_week.py
      - name: Live timing check grid (any place)
        run: python scripts/fetch_live_cells.py
      - name: Commit if anything changed
        run: |
          git config user.name "burn-clock-live-data"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/live/latest.json public/data/punjab_week.json public/data/live/week_cells.json.gz
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh provisional NASA FIRMS seven-day data"
          git push
