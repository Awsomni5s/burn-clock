name: Refresh live NASA FIRMS data
# Every six hours: download NASA FIRMS' public seven-day files (no API key), rebuild the three provisional
# live files and commit them. A host that deploys on push (Vercel) then serves the fresh data with no server.
# The historical archive is never touched.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely
      - name: Preset snapshot (all four feeds)
        run: node scripts/fetch_live.mjs
      - name: Punjab districts this week
        run: python scripts/fetch_punjab_week.py
      - name: Live timing check grid (any place)
        run: python scripts/fetch_live_cells.py
      - name: Live check for every supported country
        run: node --max-old-space-size=4096 scripts/build_live_world.mjs
      - name: Commit if anything changed
        run: |
          # Commit as the repository owner's GitHub no-reply identity: Vercel deploys only commits by its project's members.
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add public/data/live/latest.json public/data/punjab_week.json public/data/live/week_cells.json.gz public/data/live/world_live.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh provisional NASA FIRMS seven-day data (automated, live-data workflow)"
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"
        id: commit
      - name: "Optional: also ask Vercel to rebuild main through a deploy hook"
        if: steps.commit.outputs.pushed == '1'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No VERCEL_DEPLOY_HOOK secret: skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy hook called"
